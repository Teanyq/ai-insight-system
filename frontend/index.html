<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insight Generator</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8253410496421670"
        crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>

<body>
    <div class="background-glow"></div>
    <div class="container">
        <header>
            <h1>AI Insight Engine</h1>
            <p>Bridging cutting-edge AI research with business strategy</p>
        </header>

        <main>
            <div id="errorBox" class="error-box hidden"></div>

            <section class="insights-section">
                <div class="section-header">
                    <h2>Latest Reports</h2>
                    <span id="reportCount" class="badge">0</span>
                </div>
                <div id="reportsContainer" class="reports-grid">
                    <!-- Reports will be dynamically injected here -->
                </div>
            </section>
        </main>
        
        <footer class="site-footer">
            <a href="#" id="privacyLink">Privacy Policy</a> | 
            <a href="#" id="contactLink">Contact / About</a>
        </footer>
    </div>
    <!-- Modal for viewing full report -->
    <div id="reportModal" class="modal hidden">
        <div class="modal-content glass-panel" style="max-width: 900px; width: 95%;">
            <div class="modal-header-actions" style="position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: 15px; align-items: center;">
                <button id="deleteReportBtn" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s;" onmouseover="this.style.background='rgba(239, 68, 68, 0.5)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.2)'">🗑️ 削除</button>
                <span class="close-btn" style="position: static;">&times;</span>
            </div>
            <h2 id="modalTitle" style="padding-right: 120px;">Report</h2>
            <div class="tabs">
                <button class="tab-btn active" id="tabOverview">💡 Overview</button>
                <button class="tab-btn" id="tabDetails">📄 Details</button>
            </div>
            <div id="modalBodyOverview" class="markdown-body tab-content overview-mode"></div>
            <div id="modalBodyDetails" class="markdown-body tab-content hidden"></div>

            <!-- Google AdSense Placeholder -->
            <div class="ad-placeholder"
                style="margin-top: 30px; padding: 20px; text-align: center; background: rgba(255, 255, 255, 0.05); border-radius: 12px; border: 1px dashed rgba(255, 255, 255, 0.2);">
                <p style="color: #94a3b8; font-size: 0.95rem; font-weight: bold; margin-bottom: 5px;">Sponsored</p>
                <!-- Replace the code below with your actual Google AdSense script and <ins> tag -->
                <div
                    style="width: 100%; height: 90px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #64748b;">
                    Google AdSense Banner
                </div>
            </div>
        </div>
    </div>

    <!-- Info Modal (Privacy Policy / Contact) -->
    <div id="infoModal" class="modal hidden">
        <div class="modal-content glass-panel" style="max-width: 600px; width: 95%;">
            <span class="close-btn info-close-btn">&times;</span>
            <h2 id="infoModalTitle">Title</h2>
            <div id="infoModalBody" class="markdown-body" style="color: #cbd5e1; font-size: 0.95rem;"></div>
        </div>
    </div>

    </div>

    <script src="public.js"></script>
</body>

</html>
