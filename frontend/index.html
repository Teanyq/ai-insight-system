<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insight Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="background-glow"></div>
    <div class="container">
        <header>
            <h1>AI Insight Engine</h1>
            <p>Bridging cutting-edge AI research with business strategy</p>
        </header>

        <main>
            <div id="errorBox" class="error-box hidden"></div>
            
            <section class="insights-section">
                <div class="section-header">
                    <h2>Latest Reports</h2>
                    <span id="reportCount" class="badge">0</span>
                </div>
                <div id="reportsContainer" class="reports-grid">
                    <!-- Reports will be dynamically injected here -->
                </div>
            </section>
        </main>
    </div>

    
    <!-- Modal for viewing full report -->
    <div id="reportModal" class="modal hidden">
        <div class="modal-content glass-panel" style="max-width: 900px; width: 95%;">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Report</h2>
            <div class="tabs">
                <button class="tab-btn active" id="tabOverview">💡 Overview</button>
                <button class="tab-btn" id="tabDetails">📄 Details</button>
            </div>
            <div id="modalBodyOverview" class="markdown-body tab-content overview-mode"></div>
            <div id="modalBodyDetails" class="markdown-body tab-content hidden"></div>

            <!-- Monetization Placeholder -->
            <div class="ad-placeholder" style="margin-top: 30px; padding: 20px; text-align: center; background: rgba(255, 255, 255, 0.05); border-radius: 12px; border: 1px dashed rgba(255, 255, 255, 0.2);">
                <p style="color: #94a3b8; font-size: 0.95rem; margin-bottom: 12px; font-weight: bold;">✨ 役に立ったら応援をお願いします ✨</p>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <a href="#" target="_blank" style="padding: 10px 20px; background: #f59e0b; color: #1e293b; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px;">☕ 開発者にコーヒーを奢る</a>
                    <a href="#" target="_blank" style="padding: 10px 20px; background: #3b82f6; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px;">📚 おすすめAI技術書を見る</a>
                </div>
            </div>
        </div>
    </div>
    
    </div>

    <script src="public.js"></script>
</body>
</html>
